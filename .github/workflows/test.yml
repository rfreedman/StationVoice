name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      SKIP_DOTENV: "1"
      SESSION_SECRET: test-session-secret-for-pytest
    steps:
      - uses: actions/checkout@v6

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libportaudio2 ffmpeg pulseaudio pulseaudio-utils

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Sync dependencies
        run: uv sync --frozen --all-groups

      - name: basedpyright
        run: uv run basedpyright

      - name: Start PulseAudio
        run: |
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          mkdir -p "$XDG_RUNTIME_DIR"
          pulseaudio --start --exit-idle-time=-1
          for i in $(seq 1 30); do
            pactl info >/dev/null 2>&1 && break
            sleep 0.2
          done
          pactl info >/dev/null
          pactl load-module module-null-sink sink_name=ci_null \
            sink_properties=device.description=CI_Null_Output || true
          pactl set-default-sink ci_null || true

      - name: Pytest
        run: uv run pytest -q

